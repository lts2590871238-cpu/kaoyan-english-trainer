name: Build stable bilingual content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source preflight
        run: python scripts/preflight_source.py

      - name: Download ECDICT
        run: |
          mkdir -p cache
          curl -L --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/TheOpenDictionary/ecdict/master/ecdict.csv \
            -o cache/ecdict.csv
          test -s cache/ecdict.csv

      - name: Build reliable 3000-word lexicon
        run: python scripts/build_lexicon.py cache/ecdict.csv

      - name: Enrich with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BUILD_MODEL: deepseek-v4-flash
        run: python scripts/build_ai_content.py

      - name: Compile static data
        run: python scripts/compile_release.py

      - name: Validate release
        run: python scripts/validate_release.py

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanxuan-build-reports
          path: |
            data/generated/meta.json
            data/generated/lexicon_report.json
            audit/
          if-no-files-found: warn

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git diff --cached --quiet && exit 0
          git commit -m "Build validated bilingual training data"
          git push
