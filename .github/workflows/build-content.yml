name: Build stable bilingual content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xuanxuan-bilingual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source preflight
        run: python scripts/preflight_source.py

      - name: Download ECDICT
        run: |
          mkdir -p cache
          curl -L --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/TheOpenDictionary/ecdict/master/ecdict.csv \
            -o cache/ecdict.csv
          test -s cache/ecdict.csv

      - name: Build reliable 3000-word lexicon
        run: python scripts/build_lexicon.py cache/ecdict.csv

      - name: Enrich with DeepSeek
        id: enrich
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BUILD_MODEL: deepseek-v4-flash
        run: python scripts/build_ai_content.py

      # If an AI call or strict audit fails, preserve completed batches so the next manual run resumes
      # instead of paying for / waiting through the first 600 sentences again.
      - name: Save AI recovery checkpoints
        if: ${{ failure() && steps.enrich.outcome == 'failure' }}
        run: |
          if [ -d data/generated/checkpoints ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/generated/checkpoints
            if ! git diff --cached --quiet; then
              git commit -m "Save AI build recovery checkpoint"
              git push origin HEAD:main
            fi
          fi

      - name: Compile static data
        run: python scripts/compile_release.py

      - name: Validate release
        run: python scripts/validate_release.py

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanxuan-build-reports
          path: |
            data/generated/meta.json
            data/generated/lexicon_report.json
            data/generated/checkpoints/
            audit/
          if-no-files-found: warn

      - name: Commit validated generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/generated
          git diff --cached --quiet && exit 0
          git commit -m "Build validated bilingual training data"
          git push origin HEAD:main
