<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轩轩英语 AI 诊断</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff9f5;color:#374052;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#fff;border:1px solid #eadfd7;border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(60,45,40,.08)}h1{font-size:24px}.row{padding:12px;border-radius:14px;background:#faf7f3;margin:10px 0}.ok{background:#eef9f2}.bad{background:#fff1f4}.muted{color:#7d8796;font-size:13px}button{border:0;border-radius:14px;padding:11px 16px;background:#ed91ad;color:white;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f7f4f1;padding:12px;border-radius:12px}</style>
</head><body><div class="box"><h1>🤖 AI 连接诊断</h1><p class="muted">这页只检查 Cloudflare → DeepSeek，不会改学习记录。</p><div id="base" class="row">Worker 地址：读取中…</div><button id="run">运行完整自检</button><div id="self" class="row">尚未检查</div><button id="score" disabled>再做一次真实翻译评分</button><div id="scoreOut" class="row">尚未评分</div><pre id="raw"></pre></div>
<script src="config.js?v=20260906-v20"></script><script>
const base=String(window.XUANXUAN_CONFIG?.AI_PROXY_URL||'').replace(/\/$/,'');
document.querySelector('#base').textContent='Worker 地址：'+(base||'未配置');
async function getJSON(url,opt){const r=await fetch(url,{cache:'no-store',...opt});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error('返回不是JSON：'+t.slice(0,160))}return {r,j}}
document.querySelector('#run').onclick=async()=>{const el=document.querySelector('#self'),raw=document.querySelector('#raw');el.className='row';el.textContent='正在检查 Worker、Key、余额、模型、JSON…';try{const {j}=await getJSON(base+'/self-test');raw.textContent=JSON.stringify(j,null,2);if(j.ok){el.className='row ok';el.textContent=`✓ 全部通过 · ${j.version||''} · ${j.model_name||''}`;document.querySelector('#score').disabled=false}else{el.className='row bad';el.textContent='✗ '+(j.error?.message||j.error?.code||'自检失败')}}catch(e){el.className='row bad';el.textContent='✗ '+e.message}}
document.querySelector('#score').onclick=async()=>{const el=document.querySelector('#scoreOut');el.className='row';el.textContent='正在进行真实评分…';try{const {j}=await getJSON(base+'/score-translation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({direction:'en_to_zh',source:'Knowledge can change the way we see the world.',reference:'知识能够改变我们看待世界的方式。',answer:'知识可以改变我们看世界的方式。'})});if(j.ok&&Number.isFinite(j.score)){el.className='row ok';el.textContent=`✓ 评分成功：${j.score} 分 · ${j.suggestion||''}`}else{el.className='row bad';el.textContent='✗ '+(j.error?.message||'评分失败')}}catch(e){el.className='row bad';el.textContent='✗ '+e.message}}
</script></body></html>
