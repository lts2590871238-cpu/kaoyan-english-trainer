name: Build local bilingual data
on:
  workflow_dispatch:
  push:
    paths:
      - data.js
      - quality-data.js
      - scripts/build-generated.mjs
      - package.json
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:data
      - name: Commit local dictionary and translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-data.js build-report.json package-lock.json
          git diff --cached --quiet || git commit -m "Build local dictionary and translations"
          git push
