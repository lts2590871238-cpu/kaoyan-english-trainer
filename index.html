<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考研英语一真题训练器 · 2023—2026</title>
<meta name="description" content="基于2023—2026考研英语一真题的词汇、词组、长难句、无提示翻译和错题语境训练。">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">K</span><div><strong>考研英语一 · 真题训练器</strong><small>2023—2026 · 词汇 × 长难句 × 错题强化</small></div></div>
  <button class="ghost" id="resetProgress">重置进度</button>
</header>
<main>
<section id="home" class="view active">
  <div class="hero">
    <div><span class="eyebrow">TRUE PAPER TRAINER</span><h1>把真题吃透，而不是只“做过”。</h1><p>认词 → 认词组 → 拼句 → 翻译 → 拆句 → 错题回炉。所有进度保存在你的浏览器里。</p></div>
    <div class="hero-card"><div class="big" id="masteryPct">0%</div><span>综合掌握度</span><div class="progress"><i id="masteryBar"></i></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="statVocab">0</b><span>核心词/词组</span></div>
    <div class="stat"><b id="statSent">0</b><span>真题翻译句</span></div>
    <div class="stat"><b id="statWrong">0</b><span>当前错题</span></div>
    <div class="stat"><b id="statDone">0</b><span>累计练习</span></div>
  </div>
  <div class="module-grid">
    <button class="module" data-go="match"><span>01</span><h2>词汇 / 词组连线</h2><p>每轮 50 个，分 5 组 × 10。错词自动提高再次出现概率。</p><em>开始连线 →</em></button>
    <button class="module" data-go="build-en"><span>02</span><h2>汉译 → 英文拼句</h2><p>按意群重组真题长难句，混入干扰词块。</p><em>开始拼句 →</em></button>
    <button class="module" data-go="build-zh"><span>03</span><h2>英文 → 中文拼译</h2><p>不死卡中文语序，以“意义块”理解为核心。</p><em>开始拼译 →</em></button>
    <button class="module" data-go="free"><span>04</span><h2>无提示汉译</h2><p>直接写中文。评分宽松：看关键含义是否覆盖，不要求与参考译文逐字一致。</p><em>开始翻译 →</em></button>
    <button class="module" data-go="structure"><span>05</span><h2>长难句拆骨架</h2><p>主干、从句、修饰、逻辑关系逐层展开。</p><em>开始拆句 →</em></button>
    <button class="module accent" data-go="review"><span>06</span><h2>错题强化 · 真题语境填词</h2><p>把你的错词重新放回真题语境，用选择题反复回炉。</p><em>强化错题 →</em></button>
  </div>
  <div class="source-note">当前 V1 已录入 2023—2026 四套英语一真题中的核心实义词、固定搭配与 Part C 20 个翻译句。后续只扩充 <code>data.js</code>，网页逻辑无需重写。</div>
</section>

<section id="trainer" class="view">
  <div class="trainer-head"><button class="back" id="backHome">← 首页</button><div><span id="modeEyebrow" class="eyebrow"></span><h1 id="modeTitle"></h1></div><div class="year-filter" id="yearFilter"></div></div>
  <div id="trainerBody"></div>
</section>
</main>
<footer>考研英语一 · 2023—2026 真题训练器 · Static GitHub Pages Edition</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
